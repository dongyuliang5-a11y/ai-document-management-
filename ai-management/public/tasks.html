<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务 - AI Management</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside>
        <a class="brand" href="/"><div class="mark">AI</div><span>AI Management</span></a>
        <nav aria-label="主导航">
          <a href="/">总览</a><a href="/models">模型</a><a class="active" href="/tasks">任务</a>
          <a href="/datasets">数据集</a><a href="/monitoring">监控</a><a href="/settings">设置</a>
        </nav>
      </aside>
      <main>
        <header class="topbar">
          <div><h1>任务中心</h1><p class="subtitle">创建、调度并跟踪训练、评测、推理和批处理任务。</p></div>
          <div class="topbar-actions">
            <button class="primary" type="button">新建任务</button>
            <div class="pill">用户 <strong id="currentUser"></strong></div>
            <button id="logoutButton" type="button">退出</button>
          </div>
        </header>
        <section class="two-col">
          <div class="table-wrap">
            <table>
              <thead><tr><th>任务</th><th>类型</th><th>进度</th><th>状态</th><th>开始时间</th></tr></thead>
              <tbody>
                <tr><td>客服意图评测</td><td>评测</td><td><div class="progress"><span style="width: 72%"></span></div></td><td><span class="tag warn">运行中</span></td><td>08:30</td></tr>
                <tr><td>知识库向量重建</td><td>索引</td><td><div class="progress"><span style="width: 100%"></span></div></td><td><span class="tag ok">完成</span></td><td>07:45</td></tr>
                <tr><td>周报批量生成</td><td>推理</td><td><div class="progress"><span style="width: 44%"></span></div></td><td><span class="tag warn">排队</span></td><td>09:10</td></tr>
                <tr><td>异常样本回放</td><td>诊断</td><td><div class="progress"><span style="width: 18%"></span></div></td><td><span class="tag danger">需处理</span></td><td>09:35</td></tr>
              </tbody>
            </table>
          </div>
          <div class="panel">
            <h2>任务配置</h2>
            <div class="form-grid">
              <label>任务名称<input value="新建评测任务" /></label>
              <label>任务类型<select><option>模型评测</option><option>批量推理</option><option>数据索引</option></select></label>
              <label>目标模型<select><option>Orion Chat v2.8</option><option>Report Writer v1.2</option></select></label>
              <label>优先级<select><option>普通</option><option>高</option><option>低</option></select></label>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
